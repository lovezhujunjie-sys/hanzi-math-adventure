<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F7FF">
<title>汉字数学大冒险</title>
<style>
/* ══════════════════════════════════════════════════════════════
   汉字数学大冒险 · 糖果冒险主题 (融合版 UI)
   ─ 视觉设计：Lingma 的糖果色游戏风（保留全部功能结构，只换皮肤）
   ─ 配色：珊瑚红 / 薄荷青 / 柠檬黄 / 葡萄紫 / 樱花粉 多彩糖果渐变
   ─ 质感：果冻卡片 + 弹跳动画 + 漂浮 emoji + 柔和光晕背景
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F3F7FF; --bg2:#EAF1FF; --card:#ffffff;
  --ink:#2B2D42; --ink2:#5C6076; --ink3:#9096AB; --ink4:#C2C7D6;
  --line:#EDF1F9; --line2:#DDE5F2;
  --brand:#FF7A59; --brand2:#FFB03A; --brand-soft:#FFF1E8;
  --blue:#5B8DEF; --blue-soft:#E9F0FF;
  --green:#2ECC8F; --green-soft:#E3F9EF;
  --pink:#FF6FB5; --pink-soft:#FFEBF4;
  --purple:#A66CFF; --purple-soft:#F1EAFF;
  --red:#FF5C7A; --red-soft:#FFE9EE;
  --gold:#FFC93C;
  --r:22px;
  --shadow:0 6px 18px rgba(90,110,180,.10);
  --shadow2:0 12px 30px rgba(90,110,180,.18);
  --grad-brand:linear-gradient(135deg,#FF7A59,#FFB03A);
  --grad-blue:linear-gradient(135deg,#5B8DEF,#7AA9FF);
  --grad-green:linear-gradient(135deg,#2ECC8F,#5FE0B0);
  --grad-pink:linear-gradient(135deg,#FF6FB5,#FF9ECF);
  --grad-red:linear-gradient(135deg,#FF5C7A,#FF8296);
  --grad-purple:linear-gradient(135deg,#A66CFF,#C79BFF);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
/* 糖果天空背景：柔和多彩光晕 */
body{
  background-image:
    radial-gradient(circle at 10% 4%,rgba(255,182,102,.22),transparent 40%),
    radial-gradient(circle at 92% 2%,rgba(122,169,255,.22),transparent 38%),
    radial-gradient(circle at 50% 100%,rgba(255,158,207,.18),transparent 45%),
    linear-gradient(180deg,#F3F7FF 0%,#EEF3FF 100%);
  background-attachment:fixed;
}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","PingFang SC",serif;}
.app{max-width:520px;margin:0 auto;padding:16px 16px 28px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom));}
.screen{display:none;}
.screen.on{display:block;animation:fadeUp .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.center{text-align:center;}
.hide{display:none !important;}
/* 我的招牌动画库 */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.25)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ── 通用按钮：糖果胶囊 ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;padding:14px 22px;border:none;border-radius:50px;
  background:var(--card);color:var(--ink);
  font-size:18px;font-weight:800;font-family:inherit;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s ease;
}
.btn:active{transform:scale(.94);box-shadow:var(--shadow2);}
.btn.primary{background:var(--grad-brand);color:#fff;box-shadow:0 6px 18px rgba(255,122,89,.35);}
.btn.blue{background:var(--grad-blue);color:#fff;box-shadow:0 6px 18px rgba(91,141,239,.35);}
.btn.green{background:var(--grad-green);color:#fff;box-shadow:0 6px 18px rgba(46,204,143,.35);}
.btn.ghost{background:var(--card);color:var(--ink2);box-shadow:none;border:2.5px solid var(--line2);}
.btn.sm{min-height:44px;font-size:15px;padding:10px 16px;border-radius:50px;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-row .btn{flex:1;}

/* ── 顶栏 ── */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.topbar .tb-title{font-size:19px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.5px;}
.icon-btn{
  width:44px;height:44px;flex:none;border:none;border-radius:16px;background:var(--card);
  font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease;
}
.icon-btn:active{transform:scale(.9);}

/* ── 小朋友档案卡 ── */
.kid-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.kid-card{
  background:var(--card);border-radius:26px;padding:22px 14px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border:3px solid transparent;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s ease;position:relative;overflow:hidden;
}
.kid-card::before{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;opacity:.12;}
.kid-card:active{transform:scale(.95);}
.kid-card.da{border-color:#C7DBFF;background:linear-gradient(160deg,#F5F9FF,#fff);}
.kid-card.da::before{background:var(--blue);}
.kid-card.er{border-color:#FFDCC2;background:linear-gradient(160deg,#FFF7F0,#fff);}
.kid-card.er::before{background:var(--brand);}
.kid-avatar{font-size:56px;line-height:1;margin-bottom:10px;display:inline-block;animation:wiggle 3s ease-in-out infinite;}
.kid-name{font-size:21px;font-weight:900;}
.kid-tag{font-size:12px;color:var(--ink3);margin-top:5px;font-weight:600;}

/* ── 首页 ── */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.hello .av{font-size:42px;line-height:1;display:inline-block;animation:float 3s ease-in-out infinite;}
.hello .nm{font-size:23px;font-weight:900;}
.hello .sub{font-size:12px;color:var(--ink3);margin-top:3px;font-weight:600;}
.hello .switch{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2);border:2px solid var(--line2);border-radius:50px;padding:7px 14px;background:var(--card);cursor:pointer;transition:all .15s;}
.hello .switch:active{transform:scale(.94);background:var(--brand-soft);}

.stat-strip{
  display:flex;background:var(--grad-brand);border-radius:var(--r);
  padding:16px 8px;margin-bottom:16px;box-shadow:0 8px 22px rgba(255,122,89,.30);
}
.stat{flex:1;text-align:center;color:#fff;}
.stat .n{font-size:26px;font-weight:900;line-height:1.1;color:#fff;}
.stat .n .u{font-size:12px;font-weight:700;}
.stat .l{font-size:11px;color:rgba(255,255,255,.9);margin-top:4px;font-weight:600;}
.stat + .stat{border-left:1px solid rgba(255,255,255,.25);}

.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mod{
  position:relative;background:var(--card);border-radius:var(--r);padding:18px 14px;
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s ease;
  border:2px solid transparent;
}
.mod::after{content:'';position:absolute;inset:0;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,122,89,.06),rgba(122,169,255,.06));opacity:0;transition:opacity .2s;}
.mod:active{transform:scale(.95) translateY(2px);}
.mod:hover{border-color:var(--line2);}
.mod:hover::after{opacity:1;}
.mod .ico{font-size:34px;line-height:1;margin-bottom:10px;display:inline-block;animation:float 3.5s ease-in-out infinite;}
.mod .tt{font-size:16px;font-weight:900;}
.mod .ds{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.45;font-weight:600;}
.mod.wide{grid-column:1 / -1;display:flex;align-items:center;gap:16px;padding:18px;background:linear-gradient(135deg,#FFF6EF,#F0F6FF);}
.mod.wide .ico{font-size:44px;margin:0;animation:bounce 2.5s ease-in-out infinite;}
.mod.wide .txt{flex:1;min-width:0;}
.mod .badge{
  position:absolute;top:10px;right:10px;background:var(--grad-brand);color:#fff;
  font-size:11px;font-weight:800;border-radius:50px;padding:4px 10px;box-shadow:0 3px 8px rgba(255,122,89,.4);
}

/* ── 认字卡 ── */
.big-pic{font-size:80px;line-height:1;margin-bottom:14px;display:inline-block;animation:float 3s ease-in-out infinite;}
.big-pic:empty{display:none;}
.tian{
  position:relative;width:196px;height:196px;margin:0 auto;
  background:linear-gradient(160deg,#fff,#FBFDFF);border:3.5px solid var(--brand);border-radius:18px;box-shadow:0 8px 24px rgba(255,122,89,.18);
  display:flex;align-items:center;justify-content:center;
}
.tian::before,.tian::after{content:'';position:absolute;}
.tian::before{left:50%;top:6%;bottom:6%;border-left:2px dashed #FFD0BC;transform:translateX(-1px);}
.tian::after{top:50%;left:6%;right:6%;border-top:2px dashed #FFD0BC;transform:translateY(-1px);}
.tian .hz{font-size:136px;line-height:1;position:relative;color:#2B2D42;}
.py{font-size:27px;color:var(--brand);font-weight:800;margin:16px 0 4px;letter-spacing:1px;}
.hz-info{font-size:15px;color:var(--ink2);line-height:1.7;font-weight:600;}
.hz-info b{color:var(--ink);}
.example-line{background:linear-gradient(135deg,var(--brand-soft),#FFF6EF);border-radius:16px;padding:12px 16px;margin-top:12px;font-size:15px;color:var(--ink);line-height:1.6;font-weight:600;border-left:4px solid var(--brand2);}
.ci-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
.ci-chip{
  border:none;font-family:inherit;cursor:pointer;
  background:var(--bg2);border:2px solid var(--line2);border-radius:50px;
  padding:10px 18px;font-size:19px;font-weight:800;color:var(--ink);transition:all .15s;
}
.ci-chip:active{transform:scale(.93);background:var(--brand-soft);border-color:var(--brand);}
.ci-chip .sp{font-size:12px;color:var(--ink3);font-weight:600;margin-left:5px;letter-spacing:0;}

/* ── 闯关 ── */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.prog{flex:1;height:14px;background:var(--line);border-radius:50px;overflow:hidden;}
.prog i{display:block;height:100%;width:0;background:var(--grad-green);border-radius:50px;transition:width .35s cubic-bezier(.34,1.2,.64,1);}
.prog-txt{font-size:13px;font-weight:800;color:var(--ink3);flex:none;}
.q-stem{background:var(--card);border-radius:var(--r);padding:16px 14px;box-shadow:var(--shadow);text-align:center;margin-bottom:12px;}
.q-big{font-size:40px;font-weight:900;line-height:1.22;letter-spacing:2px;}
.q-big.hz{font-size:96px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;}
.q-sub{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.55;font-weight:600;}
.q-emoji{font-size:28px;letter-spacing:3px;line-height:1.45;word-break:break-all;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.choices.one{grid-template-columns:1fr;}
.choices.three{grid-template-columns:repeat(3,1fr);}
.choice{
  min-height:68px;border:none;border-radius:18px;background:var(--card);
  font-size:30px;font-weight:900;font-family:inherit;color:var(--ink);
  box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:6px;transition:transform .12s cubic-bezier(.34,1.56,.64,1);padding:6px;border:2.5px solid transparent;
}
.choice.hz{font-size:48px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;}
.choice.txt{font-size:22px;}
.choice.sym{font-size:46px;min-height:84px;}
.choice:active{transform:scale(.94);}
.choice.right{background:var(--grad-green);color:#fff;border-color:#2ECC8F;animation:bounce .5s ease;box-shadow:0 6px 18px rgba(46,204,143,.4);}
.choice.wrong{background:var(--grad-red);color:#fff;border-color:#FF5C7A;animation:shake .4s ease;box-shadow:0 6px 18px rgba(255,92,122,.4);}
.choice.dim{opacity:.35;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-8px)}44%{transform:translateX(8px)}66%{transform:translateX(-5px)}88%{transform:translateX(5px)}}

.feedback{border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:16px;line-height:1.6;font-weight:700;}
.feedback.ok{background:var(--green-soft);color:#1c9c68;border-left:4px solid var(--green);}
.feedback.no{background:var(--red-soft);color:#e0436a;border-left:4px solid var(--red);}
.feedback .why{display:block;font-size:14px;font-weight:600;margin-top:6px;color:var(--ink2);}

  /* 答错之后把「另外那几个字念什么」摊开。
     🔴 认字闯关的选项是按钮，按设计点字注音在按钮上不弹（弹了等于给答案）。
        答完就不算泄题了，所以只在**答错**时揭示——也正好是不认识那几个字的那一刻。 */
  .rv{display:block;margin-top:10px;font-weight:600;}
  .rv-t{font-size:13px;color:var(--ink3);margin-bottom:7px;font-weight:500;}
  .rv-row{display:flex;flex-wrap:wrap;gap:8px;}
  .rv-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:60px;padding:7px 11px;border:none;border-radius:14px;background:#fff;
    box-shadow:var(--shadow);cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.25;
  }
  .rv-card:active{transform:scale(.94);background:var(--brand-soft);}
  .rv-card .z{font-size:27px;font-weight:800;font-family:"Kaiti SC","STKaiti","KaiTi",serif;}
  .rv-card .w{font-size:16px;font-weight:800;}
  .rv-card .p{font-size:13px;color:var(--brand);font-weight:700;letter-spacing:.5px;}
  .rv-card.ans{outline:2.5px solid var(--green);}

.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.numpad button{
  min-height:56px;border:none;border-radius:16px;background:var(--card);font-size:25px;font-weight:900;
  font-family:inherit;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:all .12s;
}
.numpad button:active{transform:scale(.92);background:var(--grad-blue);color:#fff;}
.answer-box{
  min-height:66px;border-radius:var(--r);background:#fff;border:3.5px dashed var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;letter-spacing:2px;
  margin-bottom:4px;box-shadow:inset 0 2px 8px rgba(255,122,89,.08);
}
.answer-box .caret{width:3px;height:34px;background:var(--brand);animation:blink 1s steps(1) infinite;border-radius:2px;}
@keyframes blink{50%{opacity:0}}
.vert{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:34px;line-height:1.15;text-align:right;display:inline-block;letter-spacing:4px;font-weight:700;}
.vert .line{border-top:3px solid var(--ink);margin:2px 0 4px;}

/* 结算 */
.result-card{background:linear-gradient(160deg,#fff,#F7FAFF);border-radius:28px;padding:28px 20px;box-shadow:var(--shadow2);text-align:center;}
.result-card .big-emoji{font-size:68px;line-height:1;display:inline-block;animation:bounce 1.2s ease-in-out infinite;}
.result-card h2{font-size:25px;margin:12px 0 4px;font-weight:900;}
.stars-row{font-size:42px;letter-spacing:6px;margin:8px 0;}
.stars-row span{display:inline-block;}
.star-off{opacity:.2;}
.wrong-list{text-align:left;margin-top:16px;background:var(--bg2);border-radius:18px;padding:12px 16px;}
.wrong-list h3{font-size:14px;margin:0 0 8px;color:var(--ink2);font-weight:800;}
.wrong-list .item{font-size:17px;padding:7px 0;border-bottom:1px dashed var(--line2);font-weight:600;}
.wrong-list .item:last-child{border:none;}

/* ── 乘法口诀 ── */
.mul-table{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.mul-cell{
  background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;font-size:13px;font-weight:800;line-height:1.5;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1);border:2px solid transparent;
}
.mul-cell:active{transform:scale(.93);}
.mul-cell .r{font-size:20px;font-weight:900;color:var(--brand);display:block;}
.mul-cell.learned{background:var(--green-soft);border-color:#B8EBD3;}
.mul-big{font-size:40px;font-weight:900;line-height:1.4;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;}
.mul-big .hl{color:var(--brand);}

/* ── 描红 ── */
.trace-wrap{position:relative;width:294px;height:294px;margin:0 auto;background:linear-gradient(160deg,#fff,#FBFDFF);border-radius:20px;box-shadow:0 8px 26px rgba(255,122,89,.18);border:3.5px solid var(--brand);overflow:hidden;}
.trace-wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;}
/* 🔴 写一写整页锁死（老曾 2026-09-20）：孩子竖直写字时 iOS 会把竖向滑动当成翻页/回弹，
   页面一动手就写不出来。锁的规矩＝ html/body 不许滚 + 这一屏不响应滑动手势。
   ⚠️ 锁的前提是「一屏装得下」：田字格会按可视高度自动收小（见 05_app.js 的 fitBox），
      不然「擦掉重写 / 换一个字」会被顶到屏幕外面、锁住之后点不到。 */
html.lock-scroll,html.lock-scroll body{overflow:hidden;height:100%;overscroll-behavior:none;}
html.lock-scroll #screen-trace{touch-action:none;}
  /* 写完一个字的即时回执。以前写完屏幕上什么都不发生，孩子不知道算不算数。 */
  .trace-stamp{
    position:absolute;left:50%;top:50%;pointer-events:none;
    font-size:30px;font-weight:800;color:#fff;background:rgba(55,191,122,.93);
    padding:10px 22px;border-radius:20px;white-space:nowrap;
    transform:translate(-50%,-50%) rotate(-11deg);
    animation:stamp .42s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes stamp{
    0%{transform:translate(-50%,-50%) rotate(-11deg) scale(2.1);opacity:0}
    100%{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:1}
  }

/* ── 限时 ── */
.timer-ring{position:relative;width:100%;height:16px;background:var(--line);border-radius:50px;overflow:hidden;margin-bottom:14px;}
.timer-ring i{display:block;height:100%;width:100%;background:var(--grad-brand);transition:width .95s linear;}
.big-count{font-size:82px;font-weight:900;color:var(--brand);line-height:1;text-shadow:0 4px 12px rgba(255,122,89,.2);}

/* ── 成就 ── */
.achv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.achv{background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;box-shadow:var(--shadow);transition:transform .15s;}
.achv:not(.locked){background:linear-gradient(160deg,#FFFDF5,#fff);border:2px solid #FFE9A8;}
.achv:not(.locked) .e{animation:sparkle 2.5s ease-in-out infinite;}
.achv.locked{opacity:.4;filter:grayscale(1);}
.achv .e{font-size:34px;line-height:1;display:inline-block;}
.achv .t{font-size:12px;font-weight:800;margin-top:7px;}

.sect-title{font-size:15px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:6px;letter-spacing:.5px;}
.sect-title .hint{font-size:11px;font-weight:600;color:var(--ink3);margin-left:auto;}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);}
.list-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;}
.list-row:last-child{border:none;}
.list-row .k{flex:1;color:var(--ink2);font-size:14px;font-weight:600;}
.list-row .v{font-weight:900;color:var(--brand);}
.empty-tip{text-align:center;color:var(--ink3);font-size:14px;padding:24px 10px;line-height:1.7;font-weight:600;}

/* 撒花 */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.cf{position:absolute;font-size:24px;will-change:transform,opacity;animation:cfFall linear forwards;}
@keyframes cfFall{from{transform:translateY(-10vh) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(540deg);opacity:.1}}

.toast{
  position:fixed;left:50%;bottom:12%;transform:translateX(-50%);
  background:rgba(43,45,66,.94);color:#fff;font-size:15px;font-weight:700;
  padding:12px 22px;border-radius:50px;z-index:200;pointer-events:none;opacity:0;transition:opacity .25s ease;
  box-shadow:0 8px 24px rgba(43,45,66,.3);backdrop-filter:blur(8px);
}
.toast.on{opacity:1;}
.foot-note{text-align:center;font-size:11px;color:var(--ink4);margin-top:22px;line-height:1.7;font-weight:600;}

/* ── 点字注音气泡 ── */
.py-pop{
  position:fixed;z-index:210;left:0;top:0;
  transform:translate(-50%,-100%) scale(.9);transform-origin:50% 100%;
  background:var(--card);border:3px solid var(--brand);border-radius:20px;
  box-shadow:var(--shadow2);padding:8px 16px 10px;text-align:center;
  opacity:0;transition:opacity .16s ease,transform .16s ease;pointer-events:none;
}
.py-pop.on{opacity:1;transform:translate(-50%,-100%) scale(1);pointer-events:auto;}
.py-pop.below{transform-origin:50% 0;}
.py-pop::after{
  content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;
  border:8px solid transparent;border-top-color:var(--brand);border-bottom:0;
}
.py-pop.below::after{bottom:auto;top:-9px;border-top:0;border-bottom:8px solid var(--brand);}
.py-pop .pz{font-size:42px;line-height:1.05;font-weight:400;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;}
.py-pop .pp{font-size:20px;color:var(--brand);font-weight:900;letter-spacing:1px;margin-top:1px;}
.py-pop .pw{font-size:12px;color:var(--ink2);margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2);letter-spacing:.5px;font-weight:600;}
.py-pop .pw b{color:var(--ink);}

</style>
